<text x="1035.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">rose&#160;by,&#160;swing&#160;...)</text>
<text x="1035.0" y="208" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">substance&#160;(of&#160;flour,&#160;flour:)</text>
<text x="1035.0" y="226" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">excerpt,&#160;offsets</text>
<rect x="290" y="340" width="590" height="150" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<text x="585.0" y="364" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ConversionEvaluator</text>
<text x="585.0" y="386" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">exact&#160;&#183;&#160;rounded&#160;(digits&#160;or&#160;round&#160;figure,&#160;within&#160;tolerance)&#160;&#183;&#160;approximate&#160;&#183;&#160;plausible&#160;(density&#160;range)</text>
<text x="585.0" y="404" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">misrounded&#160;&#183;&#160;otherConvention&#160;(closest&#160;fit)&#160;&#183;&#160;loose&#160;(close&#160;but&#160;unmarked)</text>
<text x="585.0" y="422" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">wrong&#160;+&#160;slip:&#160;inverted&#160;&#183;&#160;offsetAdded&#160;&#183;&#160;offsetDropped&#160;&#183;&#160;lengthFactor&#160;&#183;&#160;waterDensity&#160;&#183;&#160;powerOfTen</text>
<text x="585.0" y="440" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">needsDensity&#160;&#8594;&#160;unchecked&#160;&#160;&#160;&#160;&#160;policies:&#160;.standard&#160;5%&#160;/&#160;5&#160;K&#160;&#183;&#160;.lenient&#160;&#183;&#160;.strict</text>
<rect x="920" y="340" width="230" height="150" rx="8" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
