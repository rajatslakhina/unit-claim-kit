<text x="590" y="540" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">No&#160;network,&#160;no&#160;dependencies.&#160;Decimal&#160;arithmetic,&#160;multiply&#160;before&#160;divide,&#160;so&#160;100&#176;C&#160;&#8594;&#160;212&#176;F&#160;comes&#160;out&#160;exact.</text>
<text x="590" y="564" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Sits&#160;beside&#160;NumberBindingKit&#160;(figures&#160;against&#160;evidence)&#160;and&#160;ArithmeticClaimKit&#160;(arithmetic&#160;with&#160;no&#160;units).</text>
