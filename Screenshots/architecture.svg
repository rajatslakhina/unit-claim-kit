<text x="440.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">QuantityScanner:&#160;numbers&#160;as&#160;written</text>
<text x="440.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">(1,609.34,&#160;&#189;,&#160;1&#160;1/2,&#160;-40,&#160;a,&#160;two)&#160;+&#160;380&#160;aliases</text>
<text x="440.0" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">(km,&#160;&#176;F,&#160;sq&#160;ft,&#160;fl&#160;oz,&#160;GB,&#160;kcal,&#160;psi&#160;...);</text>
<text x="440.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">ranges&#160;5&#8211;10&#160;km;&#160;code&#160;skipped</text>
<text x="440.0" y="208" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Link:&#160;(&#160;=&#160;&#8776;&#160;is&#160;about&#160;,&#160;or&#160;,&#160;which&#160;is</text>
<text x="440.0" y="226" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">weighs&#160;...;&#160;&quot;2&#160;cups&#160;of&#160;flour&#160;(&quot;,&#160;&quot;drive&#160;is&quot;;</text>
<text x="440.0" y="244" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">bare&#160;or&#160;and&#160;/&#160;only&#160;across&#160;systems</text>
<text x="440.0" y="262" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">&#160;and&#160;within&#160;a&#160;factor&#160;of&#160;three</text>
<rect x="630" y="90" width="250" height="210" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
<text x="755.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">UnitCatalog</text>
<text x="755.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">102&#160;sizes,&#160;11&#160;dimensions,&#160;exact</text>
<text x="755.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">fractions&#160;(&#176;F&#160;is&#160;5/9&#160;K&#160;+&#160;offset)</text>
<text x="755.0" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">sizes&#160;per&#160;word,&#160;usual&#160;first:</text>
<text x="755.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">US&#160;/&#160;imperial&#160;gallon,&#160;pint,&#160;cup;</text>
<text x="755.0" y="208" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">short&#160;/&#160;long&#160;/&#160;metric&#160;ton;</text>
<text x="755.0" y="226" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">decimal&#160;/&#160;binary&#160;GB;&#160;kcal&#160;/&#160;cal</text>
<text x="755.0" y="244" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">DensityTable:&#160;10&#160;kitchen&#160;staples,</text>
<text x="755.0" y="262" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">density&#160;as&#160;a&#160;range&#160;(flour&#160;0.50&#8211;0.60)</text>
