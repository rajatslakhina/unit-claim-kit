<text x="1035.0" y="404" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">verified,&#160;unchecked,</text>
<text x="1035.0" y="422" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">caution,&#160;wrong</text>
